{{- if not .Values.nutanix.existingSecret }}
{{- $c := .Values.nutanix.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nkpib.nutanixSecretName" . }}
  labels:
    {{- include "nkpib.labels" . | nindent 4 }}
type: Opaque
stringData:
  NUTANIX_ENDPOINT: {{ required "nutanix.credentials.endpoint is required (or set nutanix.existingSecret)" $c.endpoint | quote }}
  NUTANIX_PORT: {{ $c.port | default "9440" | quote }}
  NUTANIX_INSECURE: {{ $c.insecure | toString | quote }}
  NUTANIX_USERNAME: {{ required "nutanix.credentials.username is required (or set nutanix.existingSecret)" $c.username | quote }}
  NUTANIX_PASSWORD: {{ required "nutanix.credentials.password is required (or set nutanix.existingSecret)" $c.password | quote }}
  {{- with $c.rhsmUser }}
  RHSM_USER: {{ . | quote }}
  {{- end }}
  {{- with $c.rhsmPass }}
  RHSM_PASS: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.auth.basic.enabled (not .Values.auth.basic.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nkpib.authSecretName" . }}
  labels:
    {{- include "nkpib.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.basic.username | quote }}
  password: {{ required "auth.basic.password is required when auth.basic.enabled" .Values.auth.basic.password | quote }}
{{- end }}
