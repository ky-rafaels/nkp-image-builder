# -- Web UI image (built from webui/Dockerfile)
image:
  repository: 10.38.48.51:5000/library/nkp-image-build/nkp-image-builder-webui
  tag: "v0.2.1"          # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
replicaCount: 1

# -- Settings for the build Jobs the UI launches.
builder:
  # Image built from images/capi/Dockerfile in this repo (packer, ansible and
  # the Nutanix packer plugin preinstalled). `make -C webui image-builder`.
  image:
    repository: 10.38.48.51:5000/library/nkp-image-build/nkp-image-builder 
    tag: "v0.2.1"        # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # Pull secrets for the builder image (names of existing Secrets).
  imagePullSecrets: []
  # Packer only talks to Prism Central and SSHes to the build VM; it needs
  # little CPU. Ansible + goss output can be chatty, so give memory headroom.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  nodeSelector: {}
  tolerations: []
  # Extra env for every build, e.g. proxies for reaching Prism Central or
  # pkgs.k8s.io from the build pod itself.
  extraEnv: []
  #  - name: HTTPS_PROXY
  #    value: http://proxy.example.com:3128
  # Delete finished build Jobs (and their logs) after this many seconds.
  ttlSecondsAfterFinished: 604800   # 7 days
  # Hard limit for a single build.
  activeDeadlineSeconds: 14400      # 4 hours
  # Time given to Packer to delete the build VM when a build is cancelled.
  terminationGracePeriodSeconds: 600
  # The image-builder image runs as `imagebuilder` (uid/gid 1001 on the
  # ubuntu:24.04 base, where 1000 is the stock `ubuntu` user). Verify with:
  #   docker run --rm --entrypoint id <builder image>
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

# -- Prism Central connection used by every build unless overridden per build.
nutanix:
  # Use an existing Secret with keys NUTANIX_ENDPOINT, NUTANIX_PORT,
  # NUTANIX_INSECURE, NUTANIX_USERNAME, NUTANIX_PASSWORD (and optionally
  # RHSM_USER / RHSM_PASS for RHEL builds). This is the Secret's NAME (e.g.
  # "prism-central-creds"), not true/false. If empty, one is created from
  # `credentials` below.
  existingSecret: prism-central-creds
  credentials:
    endpoint: ""          # Prism Central host/IP, no scheme
    port: "9440"
    insecure: false
    username: ""
    password: ""
    rhsmUser: ""
    rhsmPass: ""

# -- Form defaults shown in the UI.
defaults:
  clusterName: "SA-GPU"        # Prism Element cluster to build on
  subnetName: "primary"         # subnet for the build VM; must be reachable via SSH from build pods
  kubernetesVersion: v1.36.1
  cpus: 2
  memoryMB: 4096
  diskSizeGB: 40
  imageNamePrefix: "nkp-"
  # Default image name when the form's name field is left blank. Placeholders:
  #   {prefix}    imageNamePrefix above
  #   {os}        catalog imageNameOS (derived from id: ubuntu-2404 -> ubuntu-24.04)
  #   {version}   Kubernetes version without the "v", e.g. 1.36.1
  #   {timestamp} UTC build start time, YYYYMMDDhhmmss
  #   {fips}      "-fips" for FIPS builds, empty otherwise
  #   {stig}      "-stig" for DISA STIG builds, empty otherwise
  #   {gpu}       "-gpu" (passthrough GPU) or "-vgpu" (vGPU profile) for GPU builds, empty otherwise
  # e.g. nkp-ubuntu-24.04-release-1.36.1-20261105143022.qcow2
  #      nkp-rhel-9-fips-stig-release-1.36.1-20261105143022.qcow2
  #      nkp-ubuntu-24.04-gpu-release-1.36.1-20261105143022.qcow2
  imageNameTemplate: "{prefix}{os}{fips}{stig}{gpu}-release-{version}-{timestamp}.qcow2"
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""

# -- What users can pick from. `id` must match packer/nutanix/<id>.json and the
# `build-nutanix-<id>` make target in images/capi/Makefile. Optional
# `imageNameOS` overrides the {os} part of the default image name.
# `fipsCapable` offers the FIPS 140 option for that OS (EL9 only, see `fips`),
# `stigCapable` the DISA STIG option (EL9 only, see `stig`), `gpuCapable` the
# GPU option (Ubuntu, RHEL 9 and Rocky 9, see `gpu`).
catalog:
  operatingSystems:
    - id: ubuntu-2204
      label: Ubuntu 22.04
      gpuCapable: true
    - id: ubuntu-2404
      label: Ubuntu 24.04
      gpuCapable: true
    - id: ubuntu-2604
      label: Ubuntu 26.04
      gpuCapable: true
    - id: rockylinux-9
      label: Rocky Linux 9
      fipsCapable: true
      stigCapable: true
      gpuCapable: true
    - id: rhel-9
      label: RHEL 9
      requiresImageURL: true
      requiresRHSM: true
      fipsCapable: true
      stigCapable: true
      gpuCapable: true
    - id: flatcar
      label: Flatcar
      # packer/nutanix/flatcar.json names a local file, not a URL.
      requiresImageURL: true
  # Suggestions in the version picker; users may type any v1.X.Y. Match these
  # to the Kubernetes versions supported by your NKP release.
  kubernetesVersions:
    - v1.36.2
    - v1.36.1
    - v1.35.2
    - v1.35.0
    - v1.34.2

# -- FIPS 140 node images. A FIPS build boots the VM into FIPS mode (kernel
# fips=1, FIPS crypto policy, dracut fips module) before provisioning and
# installs Kubernetes, containerd and runc built with BoringCrypto (a FIPS 140
# validated module), then goss verifies all of it. EL9 only (RHEL 9, Rocky 9).
# Use the result with the matching FIPS control plane:
#   nkp create cluster nutanix --kubernetes-version v1.36.1+fips.0 \
#     --kubernetes-image-repository docker.io/mesosphere ...
fips:
  enabled: true
  # Before starting a FIPS build, check the RPM repo has packages for the
  # requested Kubernetes version (from the web UI pod; network errors don't
  # block the build). Not every upstream patch release has a FIPS build.
  preflight: true
  # Sources. Empty uses the Nutanix/D2iQ FIPS builds NKP itself uses; point
  # these at mirrors for air-gapped sites.
  # Yum repo with FIPS kubelet/kubeadm/kubectl/cri-tools/kubernetes-cni.
  # {version} becomes e.g. v1.36.1.
  # Default: https://packages.d2iq.com/konvoy/stable/linux/repos/el/kubernetes-{version}-fips/x86_64
  kubernetesRpmRepo: ""
  # Default: https://packages.d2iq.com/konvoy/stable/linux/repos/d2iq-sign-authority-gpg-public-key
  kubernetesRpmGpgKey: ""
  # Build metadata of FIPS releases (v1.36.1+fips.0 -> image tag v1.36.1_fips.0). Default: fips.0
  kubernetesBuildMetadata: ""
  # Registry with FIPS kube-*, etcd and pause images. Default: docker.io/mesosphere
  kubernetesImageRepository: ""
  # CoreDNS isn't rebuilt for FIPS. Default: registry.k8s.io/coredns
  corednsImageRepository: ""
  # FIPS etcd tag to pre-pull. Default: kubeadm's etcd version + metadata (e.g. v3.6.8_fips.0).
  etcdImageTag: ""
  # containerd + runc bundle, laid out relative to / (usr/local/bin,
  # usr/local/sbin, etc/systemd/system). If you change the version or URL,
  # set containerdSHA256 to match.
  # Default URL: https://packages.d2iq.com/dkp/containerd/containerd-<version>-d2iq.1-rhel-9.6-x86_64_fips.tar.gz
  containerdVersion: ""   # default 2.3.1
  containerdURL: ""
  containerdSHA256: ""    # default: sha256 of the 2.3.1 bundle

# -- DISA STIG hardening (implies FIPS). The build applies the SCAP Security
# Guide "stig" profile (DISA STIG for RHEL 9) with oscap, tailored with the
# Kubernetes exceptions in images/capi/ansible/roles/stig/defaults/main.yml,
# keeps fapolicyd/usbguard/auditd/AIDE enforcing, scans the final image and
# stores results.xml, report.html, tailoring.xml and exceptions.md in the image
# under /usr/share/image-builder/stig. The scan summary ends the build log.
#
# STIG builds carve separate /var, /var/log, /var/log/audit, /var/tmp, /home
# and /tmp filesystems out of the build disk, so they need diskSizeGB >= 40.
#
# The GRUB password (V-257787, CAT I) is a secret: add a STIG_GRUB_PASSWORD_HASH
# key (output of `grub2-mkpasswd-pbkdf2`) to the Nutanix credentials Secret.
stig:
  enabled: true
  # host:port of the site's remote log host, TCP (V-258149). Empty leaves an open finding.
  remoteSyslog: ""
  # Site-approved exceptions, added to the built-in Kubernetes ones. Rule IDs
  # are SCAP Security Guide rule names (the build fails on unknown ones).
  extraExceptions: []
  #  - rule: encrypt_partitions
  #    vuln_id: V-257879
  #    reason: Data at rest is encrypted by Nutanix Data-at-Rest Encryption.

# -- GPU node images. The form lists the build cluster's GPUs and vGPU profiles
# from Prism Central; the one picked is attached to the build VM, the NVIDIA
# driver for it is installed, loaded and checked with nvidia-smi, and goss
# checks it again. A GPU that isn't free fails the build, so pick one that is.
#   * Passthrough GPUs get NVIDIA's data center driver: from the Ubuntu archive
#     on Ubuntu (follows ubuntu_repo mirrors), from NVIDIA's CUDA repo on
#     RHEL/Rocky (set nvidia.rpmRepo to mirror it).
#   * vGPU profiles get NVIDIA's vGPU guest driver, which only the NVIDIA
#     Licensing Portal distributes: put it on a mirror and set
#     nvidia.vgpuDriver. Its version must be supported by the AHV hosts' vGPU
#     manager. To license vGPUs from the image, add an
#     NVIDIA_VGPU_LICENSE_TOKEN key (the NLS client configuration token) to the
#     Nutanix credentials Secret.
# GPUs with large BARs (A100, H100, ...) need UEFI: add boot_type=uefi to the
# build's extra variables, and boot the nodes with UEFI too.
gpu:
  enabled: true
  # List GPUs from Prism Central in the form and check the chosen one before a
  # build starts. This gives the UI pod the Prism Central credentials
  # (NUTANIX_* keys of the credentials Secret, as env). When false, users type
  # the GPU name.
  discovery: true
  nvidia:
    # Data center driver branch for passthrough GPUs. Default: 580 (long-term support).
    driverBranch: ""
    # NVIDIA's open kernel modules support Turing and newer (T4, A-, L-, H-series).
    # Set false for P4, P40, P100 and V100. Default: true.
    openKernelModules: null
    # RHEL/Rocky: NVIDIA CUDA repo mirror and its key.
    # Default: https://developer.download.nvidia.com/compute/cuda/repos/rhel9/x86_64 and <repo>/D42D0685.pub
    rpmRepo: ""
    rpmGpgKey: ""
    # vGPU guest driver packages. The .run works on every OS; the .rpm
    # (RHEL/Rocky; required for DISA STIG builds) and .deb (Ubuntu) are used
    # instead where set. vGPU profiles are only offered for an OS with one.
    vgpuDriver:
      run: {url: "", sha256: ""}
      rpm: {url: "", sha256: ""}
      deb: {url: "", sha256: ""}

features:
  # Let users enter their own Prism Central / RHSM credentials per build.
  allowCredentialOverride: true
  # Let users pass extra Packer variables (credentials, SSH, image naming and
  # ansible role/post-processor hooks are always blocked).
  allowExtraVars: true

# -- Optional HTTP basic auth in front of the UI. Prefer an authenticating
# ingress / oauth2-proxy for anything beyond a lab.
auth:
  basic:
    enabled: true
    username: admin
    password: "nutanix/4u"
    existingSecret: ""   # keys: username, password

serviceAccount:
  create: true
  name: "nkp-image-builder-sa"
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 128Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: "kommander-traefik"
  annotations: 
    cert-manager.io/cluster-issuer: selfsigned-issuer
    cert-manager.io/duration: 2160h # 90 days
    cert-manager.io/renew-before: 360h # 15 days
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Log streams for long builds need long-lived connections:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: nkp-image-builder.10.38.48.141.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls: 
    - secretName: nkp-image-builder-tls
      hosts:
        - nkp-image-builder.10.38.48.141.nip.io

nodeSelector: {}
tolerations: []
affinity: {}
