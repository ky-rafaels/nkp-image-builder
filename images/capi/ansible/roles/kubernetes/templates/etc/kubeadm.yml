apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
imageRepository: {{ kubernetes_container_registry }}
kubernetesVersion: {{ kubeadm_kubernetes_version | default(kubernetes_semver) }}
dns:
  imageRepository: {{ kubernetes_coredns_image_repository | default('', true) or (kubernetes_container_registry + '/coredns') }}
{% set etcd_tag = kubeadm_etcd_image_tag | default(kubernetes_etcd_image_tag | default('', true), true) %}
{% if kubernetes_etcd_image_repository | default('', true) or etcd_tag %}
etcd:
  local:
{% if kubernetes_etcd_image_repository | default('', true) %}
    imageRepository: {{ kubernetes_etcd_image_repository }}
{% endif %}
{% if etcd_tag %}
    imageTag: {{ etcd_tag }}
{% endif %}
{% endif %}
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
nodeRegistration:
  criSocket: {{ containerd_cri_socket }}
