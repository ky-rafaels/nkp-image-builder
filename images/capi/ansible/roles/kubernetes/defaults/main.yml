---
crictl_baseurl: https://github.com/kubernetes-sigs/cri-tools/releases/download/v{{ crictl_version }}
crictl_filename: crictl-v{{ crictl_version }}-{{ system }}-{{ arch }}.tar.gz
crictl_url: "{{ crictl_baseurl }}/{{ crictl_filename }}"

kubernetes_goarch: "{{ arch }}"
kubernetes_resolved_arch: "{{ kubernetes_goarch | default(arch, true) }}"

kubernetes_bins:
  - kubeadm
  - kubectl
  - kubelet

kubernetes_primary_imgs:
  - kube-apiserver.tar
  - kube-controller-manager.tar
  - kube-scheduler.tar
  - kube-proxy.tar

kubernetes_additional_imgs:
  - pause.tar
  - coredns.tar
  - etcd.tar

kubernetes_load_additional_imgs: false

kubernetes_imgs: "{{ kubernetes_primary_imgs | union(kubernetes_additional_imgs) if kubernetes_load_additional_imgs | bool else kubernetes_primary_imgs }}"

kubernetes_cni_http_checksum: sha256:{{ kubernetes_cni_http_source }}/{{ kubernetes_cni_semver }}/cni-plugins-linux-{{ kubernetes_resolved_arch }}-{{ kubernetes_cni_semver }}.tgz.sha256

kubeadm_template: etc/kubeadm.yml

kubelet_extra_args: ""

kubernetes_enable_automatic_resource_sizing: false

# FIPS 140: kubelet/kubeadm/kubectl come from kubernetes_rpm_repo (pointed at
# a FIPS build repo by the caller), and so does crictl (cri-tools) instead of
# the upstream GitHub release.
fips_enabled: false
# Build metadata of the Kubernetes release, e.g. "fips.0" for v1.36.1+fips.0.
# kubeadm turns "+" into "_" for image tags (kube-apiserver:v1.36.1_fips.0).
kubernetes_build_metadata: ""
# Image repositories for pre-pulled images. Empty means derive from
# kubernetes_container_registry the way kubeadm does.
kubernetes_coredns_image_repository: ""
kubernetes_etcd_image_repository: ""
# etcd image tag. Empty means kubeadm's default for this Kubernetes version;
# when kubernetes_build_metadata is set, that default with the same metadata
# appended (3.6.8-0 -> v3.6.8_fips.0).
kubernetes_etcd_image_tag: ""
