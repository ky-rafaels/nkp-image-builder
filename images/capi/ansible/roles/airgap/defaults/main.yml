---
# Air-gapped builds. A directory on the Ansible controller (the build pod)
# with NKP's image-artifacts layout plus OS package bundles:
#   containerd-<version>-d2iq.1-<distro>-<version>-x86_64[_fips].tar.gz
#   images/kubernetes-images-<kubernetes version>-d2iq.1[-fips].tar
#   <kubernetes version>_<os>_<os version>_x86_64[_fips][_stig][_gpu].tar.gz
# When set, the build VM installs packages only from those bundles, gets
# containerd and the Kubernetes images from the directory, and downloads
# nothing. Empty means an online build.
airgap_artifacts_dir: ""

# OS package bundles (file names in airgap_artifacts_dir) to install from.
# Empty picks the bundle named for this build's Kubernetes version, OS,
# OS version and options, e.g. 1.36.2_rocky_9.8_x86_64_stig.tar.gz.
airgap_os_package_bundles: []

# Online builds only: save every package the build downloaded as an OS
# package bundle in this directory on the controller, for later air-gapped
# builds of the same OS, base image and options. It's named like the bundle
# such a build looks for (<k8s>_<os>_<os version>_x86_64[_fips][_stig][_gpu]
# .tar.gz).
airgap_harvest_dir: ""
# Optional URL the harvested bundle is PUT to, under its name (the web UI's
# artifact store), with the bearer token from $IB_ARTIFACTS_TOKEN.
airgap_harvest_upload_url: ""

# linux/amd64 mindthegap on the controller, which loads NKP's image bundles
# into containerd on the VM. The builder image ships one.
airgap_mindthegap_binary: ""

# Where the bundles are unpacked on the VM. Removed by sysprep.
airgap_remote_dir: /opt/image-builder/airgap
