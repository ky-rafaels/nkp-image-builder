# Sysprep, after the OS sysprep tasks re-enabled the repos the build disabled:
# remove what air-gapped and harvesting builds added, so the image matches an
# online build.
---
- name: Remove the air-gapped repos and bundles
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/yum.repos.d/image-builder-airgap.repo
    - /etc/yum.repos.d/image-builder-airgap.repo.disabled
    - /etc/apt/sources.list.d/image-builder-airgap.list
    - /etc/apt/sources.list.d/image-builder-airgap.list.disabled
    - /etc/apt/apt.conf.d/99image-builder-keep-packages
    - "{{ airgap_remote_dir }}"

- name: Check for the build's keepcache setting
  ansible.builtin.stat:
    path: /etc/dnf/.image-builder-keepcache
  register: airgap_keepcache_marker

- name: Remove the build's keepcache setting
  when: airgap_keepcache_marker.stat.exists
  block:
    - name: Remove keepcache from dnf.conf
      community.general.ini_file:
        path: /etc/dnf/dnf.conf
        section: main
        option: keepcache
        state: absent
        mode: "0644"

    - name: Remove the keepcache marker
      ansible.builtin.file:
        path: /etc/dnf/.image-builder-keepcache
        state: absent
