# Names the air-gapped artifacts are found by. OS package bundles follow
# NKP's `nkp create package-bundle` naming (<k8s>_<os>_<os version>_x86_64
# [_fips].tar.gz), plus _stig and _gpu for bundles harvested from builds with
# those options.
---
- name: Work out the air-gapped artifact names for this build
  ansible.builtin.set_fact:
    airgap_enabled: "{{ airgap_artifacts_dir | length > 0 }}"
    airgap_harvest: "{{ airgap_harvest_dir | length > 0 }}"
    airgap_os_id: >-
      {{ {'Rocky': 'rocky', 'RedHat': 'redhat', 'Ubuntu': 'ubuntu', 'OracleLinux': 'oracle'}.get(
         ansible_facts['distribution'], ansible_facts['distribution'] | lower) }}
    airgap_os_version: "{{ ansible_facts['distribution_version'] }}"
    airgap_kubernetes_version: "{{ kubernetes_semver | regex_replace('^v', '') }}"
    airgap_fips_suffix: "{{ '_fips' if fips_enabled | default(false) | bool else '' }}"
    airgap_variant_suffix: >-
      {{ ('_stig' if stig_enabled | default(false) | bool else '')
         ~ ('_gpu' if gpu_enabled | default(false) | bool else '') }}

- name: Name this build's OS package bundle
  ansible.builtin.set_fact:
    airgap_os_bundle_name: >-
      {{ airgap_kubernetes_version }}_{{ airgap_os_id }}_{{ airgap_os_version }}_x86_64{{ airgap_fips_suffix }}{{ airgap_variant_suffix }}.tar.gz
    # Without _stig/_gpu: a bundle from `nkp create package-bundle`.
    airgap_os_bundle_fallback_name: >-
      {{ airgap_kubernetes_version }}_{{ airgap_os_id }}_{{ airgap_os_version }}_x86_64{{ airgap_fips_suffix }}.tar.gz
