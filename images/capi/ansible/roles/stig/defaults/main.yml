# DISA STIG hardening of EL9 nodes with the SCAP Security Guide (SSG) "stig"
# profile, tailored for Kubernetes. Requires FIPS mode (itself a STIG CAT I
# requirement), which the build enables before provisioning.
stig_enabled: false

stig_profile: xccdf_org.ssgproject.content_profile_stig
stig_content_dir: /usr/share/xml/scap/ssg/content
# Tailoring, exception list and scan reports are kept in the image as
# evidence for assessors.
stig_report_dir: /usr/share/image-builder/stig

# Rules a Kubernetes node cannot meet. Each becomes a deselected rule in the
# tailoring file and an entry in the exceptions document for the ISSM.
stig_kubernetes_exceptions:
  - rule: sysctl_net_ipv4_conf_all_forwarding
    vuln_id: V-257970
    reason: >-
      Kubernetes nodes route pod traffic. kubeadm's preflight checks require
      net.ipv4.ip_forward=1 and every CNI plugin depends on it.
  - rule: sysctl_net_ipv6_conf_all_forwarding
    vuln_id: V-257974
    reason: >-
      Required for IPv6 and dual-stack pod networking, for the same reason as
      IPv4 forwarding.
  - rule: service_firewalld_enabled
    vuln_id: V-257936
    reason: >-
      The CNI plugin (Cilium on NKP) programs the node's packet filtering
      (iptables/nftables/eBPF) and enforces host and pod network policy;
      firewalld rewriting the same tables breaks pod networking, and its
      default zone rejects kubelet, API server and CNI overlay traffic.
      firewalld is installed and configured by the other STIG rules but the
      service is masked. Host firewalling is provided by CNI host policies
      and/or Nutanix Flow.
  - rule: configured_firewalld_default_deny
    vuln_id: V-257937
    reason: See V-257936; firewalld is installed but masked.
  - rule: firewalld_sshd_port_enabled
    vuln_id: V-257940
    reason: See V-257936; firewalld is installed but masked.
  - rule: package_nfs-utils_removed
    vuln_id: V-257828
    reason: >-
      kubelet mounts NFS-backed PersistentVolumes (e.g. Nutanix Files via the
      Nutanix CSI driver) with the host's mount.nfs from nfs-utils.
  - rule: package_gssproxy_removed
    vuln_id: V-257832
    reason: >-
      nfs-utils requires gssproxy (RPM dependency), so removing gssproxy also
      removes nfs-utils; see V-257828. gssproxy is only used for Kerberos
      (sec=krb5) NFS mounts.
  - rule: sysctl_user_max_user_namespaces_no_remediation
    vuln_id: V-257816
    reason: >-
      Container runtimes and Kubernetes user-namespaced pods (hostUsers:
      false) create user namespaces. The STIG permits this when the use is
      operationally required and documented with the ISSM.

# Site-specific additions: [{rule: <ssg rule id>, vuln_id: V-..., reason: ...}]
stig_extra_exceptions: []

# Deselected only while provisioning, then applied by the final build step
# (packer/files/stig/finalize-stig.sh): the build user's NOPASSWD sudo rule is
# needed by goss, and the user is deleted at shutdown.
stig_build_phase_deselect:
  - sudo_remove_nopasswd

# Remediated while provisioning and again by the final build step, because
# later build steps undo them: file_permission_user_init_files_root's fix
# makes every dotfile in root's and the build user's home 0740 or less, and
# later steps create new ones (Ansible, goss, the GPU role).
stig_final_reapply:
  - file_permission_user_init_files_root

# Deselected while provisioning and NOT re-applied by the deferred step,
# because packer/files/stig/finalize-stig.sh does the work itself, once,
# after the image is complete: aide_build_database's fix runs `aide --init`
# over the whole filesystem, and finalize rebuilds the baseline anyway right
# before the final scan (which still checks the rule).
stig_build_phase_skip:
  - aide_build_database

# V-258149 (CAT II): remote log host, "host:port" over TCP. Empty leaves it a
# finding to be met by the site's logging configuration.
stig_remote_syslog: ""
# V-257787 (CAT I): GRUB superuser password as a grub2-mkpasswd-pbkdf2 hash
# (grub.pbkdf2.sha512.…). Empty leaves it a finding.
stig_grub_password_hash: ""
# V-257789 (CAT I): the GRUB superuser's name, which the password above
# belongs to (type both at the GRUB prompt to edit a boot entry). Letters and
# underscores; not root, admin, administrator or a local account's name.
stig_grub_superuser: bootadmin

# V-257945: time sources, written as "server <name> iburst maxpoll 16" in
# place of the OS's "pool" line. Empty uses the STIG profile's own value
# (var_multiple_time_servers, the DoD source 0.us.pool.ntp.mil). Servers
# DHCP announces are still used (chrony's sourcedir).
stig_ntp_servers: []

# V-257948: two or more DNS servers. The image's resolv.conf comes from DHCP
# at boot, so the image passes only if the build network's DHCP announces
# two. Set to use these servers on every node instead (NetworkManager global
# DNS, replacing DHCP's); empty leaves it to the network.
stig_dns_servers: []

# V-272496: the sudoers group whose members sudo into the SELinux sysadm_t
# domain ("%wheel ALL=(ALL) TYPE=sysadm_t ROLE=sysadm_r ALL"). Members must be
# SELinux staff_u users (semanage login -a -s staff_u <user>): sudo refuses
# the sysadm_r role to the default unconfined_u. Accounts with their own
# sudoers rule later in sudoers.d (the node user cloud-init creates) are not
# affected. Empty leaves it a finding.
stig_sudo_admin_group: wheel

# V-258058: local accounts allowed besides the STIG profile's RHEL 9 list
# (var_accounts_authorized_local_users_regex), each created by a package the
# image needs. Listed in exceptions.md.
stig_authorized_local_users:
  - name: rpc
    reason: rpcbind, which nfs-utils requires (see V-257828).
  - name: rpcuser
    reason: nfs-utils (see V-257828).
  - name: fapolicyd
    reason: fapolicyd, which the STIG requires (V-258089).
  - name: postfix
    reason: postfix, which the STIG requires (V-272488).
  - name: unbound
    reason: unbound-libs, which libreswan requires (V-257954).
  - name: nvidia-persistenced
    reason: NVIDIA's persistence daemon, on GPU images only.
# Site accounts, e.g. the node SSH user the cluster's cloud-init creates:
# [{name: ..., reason: ...}]
stig_extra_authorized_local_users: []
# Packer's SSH user. It exists until the shutdown command deletes it, after
# the final scan, so the scan allows it.
stig_build_user: ""

# V-257991, V-270178: the SSH MACs the scan expects, in the order the
# FIPS:STIG crypto policy writes them. The profile's own value lists the same
# four MACs in another order, and its fips_custom_stig_sub_policy rule
# (V-258241) writes the STIG module that sets this order, so the two can't
# both pass. DISA's check compares the set of MACs, not their order.
stig_sshd_approved_macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256

# Non-RPM executables (the containerd/runc bundle, crictl) are added to the
# fapolicyd trust database so the STIG's deny-by-default policy lets them run.
stig_fapolicyd_trusted_dirs:
  - /usr/local/bin
  - /usr/local/sbin

# Executables that later build steps run after fapolicyd is enforcing (the
# goss binary). Allowed by exact path in a build-only rule file that
# packer/files/stig/finalize-stig.sh deletes before the final scan.
stig_fapolicyd_build_allow_paths: []

# Packages the STIG profile itself installs that other STIG rules depend on.
# oscap decides which rules apply before it remediates anything, so a rule
# that needs a package the same pass installs is skipped as "notapplicable"
# and then fails the final scan (e.g. configure_usbguard_auditbackend,
# V-258037). Installing them first lets one remediation pass fix them all.
# A package is skipped if its package_<name>_installed rule is an exception.
stig_preinstall_packages:
  - usbguard
  - postfix
  - firewalld
