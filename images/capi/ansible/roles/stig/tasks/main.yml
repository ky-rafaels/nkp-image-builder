---
- name: Fail if the distribution has no STIG support here
  ansible.builtin.fail:
    msg: >-
      DISA STIG hardening is supported on RHEL 9 and Rocky Linux 9 here, not
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
  when: >-
    ansible_facts['distribution'] not in ['RedHat', 'Rocky']
      or ansible_facts['distribution_major_version'] != '9'

- name: Read the kernel FIPS state
  ansible.builtin.slurp:
    src: /proc/sys/crypto/fips_enabled
  register: stig_fips_state

- name: Fail if the system is not in FIPS mode (STIG V-258230, CAT I)
  ansible.builtin.fail:
    msg: The DISA STIG requires FIPS mode; build with fips_enabled=true.
  when: (stig_fips_state.content | b64decode | trim) != '1'

- name: Install the SCAP scanner, SSG content and fapolicyd
  ansible.builtin.dnf:
    name:
      - openscap-scanner
      - scap-security-guide
      - fapolicyd
      - rsyslog
    state: present
    lock_timeout: 60

- name: Select the SSG datastream for this distribution
  ansible.builtin.set_fact:
    stig_datastream: >-
      {{ stig_content_dir }}/ssg-{{ 'rl9' if ansible_facts['distribution'] == 'Rocky' else 'rhel9' }}-ds.xml
    stig_all_exceptions: "{{ stig_kubernetes_exceptions + stig_extra_exceptions }}"

- name: Read the STIG profile metadata
  ansible.builtin.command: oscap info --profile {{ stig_profile }} {{ stig_datastream }}
  register: stig_profile_info
  changed_when: false

- name: Read the SSG version
  ansible.builtin.command: rpm -q --qf '%{VERSION}-%{RELEASE}' scap-security-guide
  register: stig_ssg_rpm
  changed_when: false

- name: Record profile details
  ansible.builtin.set_fact:
    # e.g. "DISA STIG for Red Hat Enterprise Linux 9 V2R9", from the description.
    stig_profile_title: >-
      {{ stig_profile_info.stdout | regex_search('DISA STIG for [^.]*V\d+R\d+')
         | default(stig_profile_info.stdout | regex_search('Title: (.*)', '\1') | first, true) }}
    stig_ssg_version: "{{ stig_ssg_rpm.stdout }}"

- name: Create the STIG evidence directory
  ansible.builtin.file:
    path: "{{ stig_report_dir }}"
    state: directory
    mode: "0755"

- name: Write the tailoring file
  ansible.builtin.template:
    src: tailoring.xml.j2
    dest: "{{ stig_report_dir }}/tailoring.xml"
    mode: "0644"

- name: Write the exceptions document
  ansible.builtin.template:
    src: exceptions.md.j2
    dest: "{{ stig_report_dir }}/exceptions.md"
    mode: "0644"

- name: Check every exception names a rule in the datastream
  ansible.builtin.shell:
    cmd: |
      missing=""
      for r in {{ (stig_all_exceptions | map(attribute='rule') | list + stig_build_phase_deselect + stig_build_phase_skip) | join(' ') }}; do
        grep -q "id=\"xccdf_org.ssgproject.content_rule_${r}\"" {{ stig_datastream }} || missing="$missing $r"
      done
      if [ -n "$missing" ]; then echo "Unknown STIG rule(s):$missing" >&2; exit 1; fi
  changed_when: false

- name: Check the tailored profile resolves
  ansible.builtin.command: >-
    oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_stig_kubernetes_node
    --tailoring-file {{ stig_report_dir }}/tailoring.xml
    --rule xccdf_org.ssgproject.content_rule_package_aide_installed
    {{ stig_datastream }}
  register: stig_tailoring_check
  failed_when: stig_tailoring_check.rc not in [0, 2]
  changed_when: false

- name: Record paths for the final build step
  ansible.builtin.copy:
    dest: "{{ stig_report_dir }}/stig.env"
    mode: "0644"
    content: |
      STIG_DATASTREAM={{ stig_datastream }}
      STIG_TAILORING={{ stig_report_dir }}/tailoring.xml
      STIG_PROFILE=xccdf_org.ssgproject.content_profile_stig_kubernetes_node
      STIG_BUILD_PHASE_RULES="{{ stig_build_phase_deselect | map('regex_replace', '^', 'xccdf_org.ssgproject.content_rule_') | join(' ') }}"

# --- Kubernetes allowances that must exist before fapolicyd starts enforcing.

- name: Find executables that are not from an RPM
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      find {{ stig_fapolicyd_trusted_dirs | join(' ') }} -maxdepth 1 -type f -perm -u+x 2>/dev/null |
        while read -r f; do rpm -qf "$f" >/dev/null 2>&1 || echo "$f"; done
    executable: /bin/bash
  register: stig_untrusted_executables
  changed_when: false

- name: Reset the Kubernetes fapolicyd trust file
  ansible.builtin.file:
    path: /etc/fapolicyd/trust.d/kubernetes
    state: absent

- name: Trust the container runtime binaries in fapolicyd
  ansible.builtin.command: fapolicyd-cli --file add {{ item }} --trust-file kubernetes
  loop: "{{ stig_untrusted_executables.stdout_lines }}"
  changed_when: true

- name: Allow runtime-installed CNI and kubelet plugins in fapolicyd
  ansible.builtin.copy:
    src: 35-kubernetes.rules
    dest: /etc/fapolicyd/rules.d/35-kubernetes.rules
    owner: root
    group: fapolicyd
    mode: "0644"

- name: Allow later build steps' executables in fapolicyd (removed at the end of the build)
  ansible.builtin.copy:
    dest: /etc/fapolicyd/rules.d/36-image-builder-build.rules
    owner: root
    group: fapolicyd
    mode: "0644"
    content: |
      # Build-time only: deleted by image-builder's final STIG step.
      {% for p in stig_fapolicyd_build_allow_paths %}
      allow perm=execute all : path={{ p }}
      {% endfor %}
  when: stig_fapolicyd_build_allow_paths | length > 0

# --- Site-specific settings the STIG can't remediate generically.

- name: Set the GRUB superuser password (V-257787)
  ansible.builtin.copy:
    dest: /boot/grub2/user.cfg
    content: "GRUB2_PASSWORD={{ stig_grub_password_hash }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: stig_grub_password_hash | length > 0

- name: Forward logs to the remote log host (V-258149)
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/90-remote-loghost.conf
    content: |
      # DISA STIG V-258149: off-load audit and system logs.
      *.* @@{{ stig_remote_syslog }}
    mode: "0644"
  when: stig_remote_syslog | length > 0

# --- Remediation.

- name: Install packages that other STIG rules depend on
  ansible.builtin.dnf:
    name: "{{ stig_preinstall }}"
    state: present
    lock_timeout: 60
  vars:
    stig_preinstall: >-
      {{ stig_preinstall_packages | reject('in',
           stig_all_exceptions | map(attribute='rule')
           | select('match', '^package_.*_installed$')
           | map('regex_replace', '^package_(.*)_installed$', '\1') | list) | list }}
  when: stig_preinstall | length > 0

# The STIG's kernel argument rules (audit=1, pti=on, audit_backlog_limit, ...)
# are fixed with `grubby --update-kernel=ALL --args=...` and checked in both
# the boot entries and GRUB_CMDLINE_LINUX in /etc/default/grub. grubby only
# updates GRUB_CMDLINE_LINUX when it is already set; cloud images such as
# Rocky's GenericCloud keep everything in GRUB_CMDLINE_LINUX_DEFAULT, so the
# arguments reach the boot entries but not /etc/default/grub and the rules
# fail. Move the default kernel's arguments (including fips=1) there first.
- name: Keep the kernel command line in GRUB_CMDLINE_LINUX
  ansible.builtin.shell:
    cmd: |
      set -o errexit -o nounset -o pipefail
      f=/etc/default/grub
      current=$(set +o nounset; . "$f" >/dev/null 2>&1; printf '%s' "${GRUB_CMDLINE_LINUX:-}")
      if [ -n "$current" ]; then echo "unchanged"; exit 0; fi
      args=$(grubby --info=DEFAULT | sed -n 's/^args="\(.*\)"$/\1/p')
      kept=()
      for a in $args; do
        # root= and ro are added by grub2-mkconfig; $vars are grubenv references.
        case "$a" in root=*|ro|rw|\$*) ;; *) kept+=("$a") ;; esac
      done
      [ -n "${kept[*]}" ] || { echo "no kernel arguments found in the default boot entry" >&2; exit 1; }
      sed -i -e '/^[[:space:]]*GRUB_CMDLINE_LINUX=/d' -e '/^[[:space:]]*GRUB_CMDLINE_LINUX_DEFAULT=/d' "$f"
      printf 'GRUB_CMDLINE_LINUX="%s"\nGRUB_CMDLINE_LINUX_DEFAULT=""\n' "${kept[*]}" >>"$f"
      echo "changed: GRUB_CMDLINE_LINUX=\"${kept[*]}\""
    executable: /bin/bash
  register: stig_grub_cmdline
  changed_when: stig_grub_cmdline.stdout is search('^changed')

- name: Apply the DISA STIG profile (this takes several minutes)
  ansible.builtin.command: >-
    oscap xccdf eval --remediate
    --profile xccdf_org.ssgproject.content_profile_stig_kubernetes_node_build
    --tailoring-file {{ stig_report_dir }}/tailoring.xml
    --results {{ stig_report_dir }}/remediation-results.xml
    {{ stig_datastream }}
  register: stig_remediation
  # 0: all pass, 2: some rules still fail (e.g. ones that need a site
  # decision or a secret); anything else is an error.
  failed_when: stig_remediation.rc not in [0, 2]
  changed_when: true

- name: Summarize the remediation
  ansible.builtin.debug:
    msg:
      - "fixed: {{ stig_remediation.stdout | regex_findall('Result\\s+fixed') | length }}"
      - "pass: {{ stig_remediation.stdout | regex_findall('Result\\s+pass') | length }}"
      - "still failing: {{ stig_remediation.stdout | regex_findall('Result\\s+fail') | length }}"
      - "remediation errors: {{ stig_remediation.stdout | regex_findall('Result\\s+error') | length }}"

# The profile installs firewalld (stig_preinstall_packages installs it first),
# and the RPM enables the service through the EL9 systemd presets. Running in
# its default "public" zone it rejects kubelet (10250), the API server, etcd
# and the CNI's overlay/health ports, so nodes never become Ready. With the
# Kubernetes exception (V-257936) firewalld stays installed for the rules that
# configure it but must not run. Masked so nothing starts it as a dependency.
- name: Stop and disable firewalld (the CNI owns packet filtering, V-257936)
  ansible.builtin.systemd:
    name: firewalld
    enabled: false
    state: stopped
  when: "'service_firewalld_enabled' in stig_all_exceptions | map(attribute='rule')"

- name: Mask firewalld
  ansible.builtin.systemd:
    name: firewalld
    masked: true
  when: "'service_firewalld_enabled' in stig_all_exceptions | map(attribute='rule')"

- name: Check fapolicyd is enforcing
  ansible.builtin.command: systemctl is-active fapolicyd
  changed_when: false

- name: Check the container runtime still executes under fapolicyd
  ansible.builtin.command: "{{ item }}"
  loop:
    - /usr/local/bin/containerd --version
    - /usr/local/sbin/runc --version
    - /usr/bin/kubelet --version
    - /usr/bin/kubeadm version -o short
  changed_when: false
