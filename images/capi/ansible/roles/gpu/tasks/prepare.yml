# First half of the attached-GPU flow (ansible/gpu-prepare.yml), run after the
# setup role has brought the OS up to date and before the build reboots into
# the newest kernel: keep nouveau from claiming the GPU at that boot, so the
# NVIDIA driver installed by install.yml can load on the same boot.
---
- name: Check the OS is supported for an attached GPU
  ansible.builtin.assert:
    that: ansible_facts['os_family'] in ['Debian', 'RedHat']
    fail_msg: >-
      Installing the driver for a GPU attached to the build VM is supported on
      Ubuntu, RHEL and Rocky Linux, not {{ ansible_facts['distribution'] }}.
    quiet: true

- name: Block the nouveau driver
  ansible.builtin.template:
    src: etc/modprobe.d/blocklist-nouveau.conf
    dest: /etc/modprobe.d/blocklist-nouveau.conf
    mode: "0644"

# The initramfs carries modprobe.d, and nouveau would otherwise load from it.
- name: Rebuild every installed kernel's initramfs without nouveau
  ansible.builtin.command: >-
    {{ 'update-initramfs -u -k all' if ansible_facts['os_family'] == 'Debian'
       else 'dracut --force --regenerate-all' }}
  changed_when: true
