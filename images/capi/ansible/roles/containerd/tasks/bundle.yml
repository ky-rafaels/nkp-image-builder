---
# Installs a containerd bundle: containerd, its shim and runc, plus the
# matching containerd.service, built by a vendor rather than taken from the
# upstream releases. FIPS builds use containerd_fips_url (built against a
# FIPS 140 validated crypto module); other builds containerd_bundle_url (e.g.
# NKP's own containerd-<version>-d2iq.1 builds). Unlike the upstream release
# archive, the bundle is laid out relative to / (usr/local/bin, usr/local/sbin,
# etc/systemd/system), so it replaces the separate upstream runc download as
# well.
- name: Fail if no FIPS containerd bundle is configured
  ansible.builtin.fail:
    msg: fips_enabled is true but containerd_fips_url is empty.
  when: fips_enabled | bool and containerd_fips_url | length == 0

- name: Download containerd bundle
  ansible.builtin.get_url:
    url: "{{ containerd_bundle_install_url }}"
    checksum: "{{ ('sha256:' + containerd_bundle_install_sha256) if containerd_bundle_install_sha256 | length > 0 else omit }}"
    dest: /tmp/containerd-bundle.tar.gz
    mode: "0600"
  register: containerd_bundle_download
  until: containerd_bundle_download is not failed
  retries: 5
  delay: 3

- name: List containerd bundle
  ansible.builtin.command: tar -tzf /tmp/containerd-bundle.tar.gz
  register: containerd_bundle_contents
  changed_when: false

- name: Check containerd bundle layout
  ansible.builtin.assert:
    that:
      - "'usr/local/bin/containerd' in containerd_bundle_contents.stdout_lines"
      - "'usr/local/sbin/runc' in containerd_bundle_contents.stdout_lines"
      - "'etc/systemd/system/containerd.service' in containerd_bundle_contents.stdout_lines"
      # Nothing outside usr/local and etc/systemd, since the bundle is unpacked at /.
      - containerd_bundle_contents.stdout_lines | reject('match', '^(\\./)?(etc/|etc/systemd/.*|usr/|usr/local/.*)$') | list | length == 0
    fail_msg: >-
      {{ containerd_bundle_install_url }} does not look like a containerd bundle: expected only
      usr/local/bin/containerd*, usr/local/sbin/runc and etc/systemd/system/containerd.service.

- name: Unpack containerd bundle
  ansible.builtin.unarchive:
    remote_src: true
    src: /tmp/containerd-bundle.tar.gz
    dest: /
    extra_opts:
      - --no-overwrite-dir
      - --no-same-owner

- name: Remove containerd bundle archive
  ansible.builtin.file:
    path: /tmp/containerd-bundle.tar.gz
    state: absent
