---
- name: RHEL subscription
  community.general.redhat_subscription:
    state: present
    username: "{{ lookup('env', 'RHSM_USER') }}"
    password: "{{ lookup('env', 'RHSM_PASS') }}"
    auto_attach: true
  when:
    - ansible_facts['distribution'] == "RedHat"
    - lookup('env', 'RHSM_USER') | length > 0
    - lookup('env', 'RHSM_PASS') | length > 0

- name: Download packages in parallel during the build
  when:
    - ansible_facts['pkg_mgr'] == 'dnf'
    - setup_dnf_build_max_parallel_downloads | int > 0
  block:
    - name: Read dnf.conf
      ansible.builtin.slurp:
        src: /etc/dnf/dnf.conf
      register: setup_dnf_conf

    # The marker tells the sysprep role this build added the setting, so it
    # removes only what the build added.
    - name: Set max_parallel_downloads until sysprep
      when: setup_dnf_conf.content | b64decode is not search('(?m)^\s*max_parallel_downloads\s*=')
      block:
        - name: Set max_parallel_downloads in dnf.conf
          community.general.ini_file:
            path: /etc/dnf/dnf.conf
            section: main
            option: max_parallel_downloads
            value: "{{ setup_dnf_build_max_parallel_downloads }}"
            no_extra_spaces: true
            mode: "0644"

        - name: Mark max_parallel_downloads as added by the build
          ansible.builtin.copy:
            dest: /etc/dnf/.image-builder-max-parallel-downloads
            content: ""
            mode: "0600"

- name: Perform dnf clean
  ansible.builtin.command: /usr/bin/yum -y clean all
  when: setup_dnf_clean | bool

- name: Enable the EPEL repository
  ansible.builtin.command: amazon-linux-extras enable epel
  args:
    creates: /etc/yum.repos.d/epel.repo
  when: packer_builder_type.startswith('amazon') and ansible_facts['distribution'] == "Amazon"

- name: Install EPEL package
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when: packer_builder_type.startswith('amazon') and ansible_facts['distribution'] == "Amazon"

- name: Import epel gpg key
  ansible.builtin.rpm_key:
    state: present
    key: "{{ epel_rpm_gpg_key }}"
  when: epel_rpm_gpg_key != "" and ansible_facts['distribution'] != "Amazon" and not packer_builder_type.startswith('scaleway')

- name: Add epel repo
  ansible.builtin.dnf:
    name: "{{ redhat_epel_rpm }}"
    state: present
    lock_timeout: 60
  when: redhat_epel_rpm != "" and ansible_facts['distribution'] != "Amazon" and not packer_builder_type.startswith('scaleway')

- name: Import RPM repository tasks
  ansible.builtin.import_tasks: rpm_repos.yml

- name: Perform a yum update  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
    lock_timeout: 60
    exclude: "{{ 'lsvpd*' if ansible_facts['distribution_major_version'] | int == 10 else omit }}"

- name: Install baseline dependencies
  ansible.builtin.dnf:
    name: "{{ rpms }}"
    state: present
    lock_timeout: 60

- name: Install extra rpms
  ansible.builtin.dnf:
    name: "{{ extra_rpms.split() }}"
    state: present
    lock_timeout: 60
