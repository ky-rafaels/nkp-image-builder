# First step of every build, before the FIPS and STIG steps install their
# first packages. An air-gapped build (airgap_artifacts_dir) checks its
# artifacts and makes the uploaded OS package bundles the only package
# repos; a harvesting build (airgap_harvest_dir) starts keeping the
# packages it downloads (roles/airgap). Does nothing, without connecting,
# for other builds.
---
- name: Prepare the build VM for an air-gapped or harvesting build
  hosts: all
  become: true
  gather_facts: false
  vars:
    node_environment:
      http_proxy: "{{ http_proxy | default('') }}"
      https_proxy: "{{ https_proxy | default('') }}"
      no_proxy: "{{ no_proxy | default('') }}"
      HTTP_PROXY: "{{ http_proxy | default('') }}"
      HTTPS_PROXY: "{{ https_proxy | default('') }}"
      NO_PROXY: "{{ no_proxy | default('') }}"
      PYTHONPATH: "{{ python_path }}"

  tasks:
    - name: Skip unless the build is air-gapped or harvesting
      ansible.builtin.meta: end_play
      when: >-
        (airgap_artifacts_dir | default('')) | length == 0
        and (airgap_harvest_dir | default('')) | length == 0

    - name: Gather facts
      ansible.builtin.setup:

    - name: Prepare the air-gapped or harvesting build
      ansible.builtin.include_role:
        name: airgap
        tasks_from: prepare

  environment: "{{ node_environment }}"
